<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11130f" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    {{styles}}
  </head>
  <body>
    <!-- Generated by npm run build. Edit decks/{{id}}/ instead. -->
    <main
      class="presentation"
      data-deck-id="{{id}}"
      data-deck-title="{{title}}"
      data-theme="{{theme}}"
      aria-label="{{title}} 幻灯片"
    >
      <div class="stage-wrap">
        <div class="stage" id="stage" aria-live="off">{{slides}}</div>
      </div>
      <nav class="control-bar" aria-label="演示控制">
        <div class="control-brand">
          <span class="control-mark">✳</span
          ><a href="gallery.html">{{brand}}</a>
        </div>
        <a class="deck-link" href="gallery.html" aria-label="查看所有演示稿"
          >所有演示 ↗</a
        >
        <div class="progress-track" aria-label="演示进度">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="slide-counter" role="status" aria-live="polite">
          <span id="current-slide">01</span><span aria-hidden="true">/</span
          ><span id="slide-total">{{count}}</span>
        </div>
        <div class="control-actions">
          <button
            class="control-button"
            id="overview-button"
            aria-label="打开目录"
            aria-expanded="false"
            aria-controls="overview"
            aria-haspopup="dialog"
            title="目录 O"
          >
            <span aria-hidden="true">▦</span><small>目录</small>
          </button>
          <button
            class="control-button"
            id="notes-button"
            aria-label="显示讲者备注"
            aria-expanded="false"
            aria-controls="notes-panel"
            title="备注 N"
          >
            <span aria-hidden="true">▤</span><small>备注</small>
          </button>
          <button
            class="control-button"
            id="fullscreen-button"
            aria-label="全屏"
            aria-pressed="false"
            title="全屏 F"
          >
            <span aria-hidden="true">⛶</span><small>全屏</small>
          </button>
          <button class="nav-button" id="prev-button" aria-label="上一页">
            ←
          </button>
          <button class="nav-button" id="next-button" aria-label="下一页">
            →
          </button>
        </div>
      </nav>
      <aside
        class="notes-panel"
        id="notes-panel"
        aria-label="讲者备注"
        aria-hidden="true"
        inert
      >
        <div>
          <span class="notes-label">SPEAKER NOTES</span
          ><button id="close-notes" aria-label="关闭备注">×</button>
        </div>
        <p id="notes-text"></p>
        <small>N 关闭 · 此面板也会出现在投屏画面中</small>
      </aside>
      <div
        class="overview"
        id="overview"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overview-heading"
        aria-hidden="true"
        inert
      >
        <div class="overview-head">
          <div>
            <span>{{brand}}</span>
            <h2 id="overview-heading">在这场演示中</h2>
          </div>
          <button id="close-overview" aria-label="关闭目录">×</button>
        </div>
        <div class="overview-grid" id="overview-grid"></div>
        <div class="overview-foot">
          <span>方向键选择 · Enter 打开 · 数字 1–9 跳页</span
          ><span>ESC 关闭 <b>✳</b></span>
        </div>
      </div>
      <div class="toast" id="toast" role="status"></div>
      <div class="help-hint" id="help-hint">
        <span>← → / Space</span> 翻页 <i>·</i> <span>Home / End</span> 首尾
        <i>·</i> <span>O</span> 目录 <i>·</i> <span>N</span> 备注 <i>·</i>
        <span>F</span> 全屏 <i>·</i> <span>?</span> 帮助
      </div>
    </main>
    <script src="runtime/presentation.js" defer></script>
{{scripts}}
  </body>
</html>
