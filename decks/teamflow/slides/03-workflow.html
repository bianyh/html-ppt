<section
  id="workflow"
  class="slide"
  data-title="把协作，收拢到三件事"
  data-notes="用三个清晰动作解释产品机制：共同定义目标，把关键决策留在上下文里，以可检查的下一步维持进展。"
  aria-label="把协作，收拢到三件事"
>
  <div class="deck-shell">
    <div class="deck-kicker">
      <span>02 / HOW IT WORKS</span><span>一个轻量的协作回路</span>
    </div>
    <header>
      <p class="deck-eyebrow">ONE PLACE. THREE HABITS.</p>
      <h2 class="deck-title">
        把协作，<span class="deck-accent">收拢到三件事。</span>
      </h2>
      <p class="deck-lead">让每一次更新都留下线索，让每个人都能接着往下做。</p>
    </header>
    <div class="layout-cards">
      <article class="c-card">
        <span class="c-card__index">01 / ALIGN</span>
        <div class="workflow-glyph" aria-hidden="true">◎</div>
        <h3 class="c-card__title">对齐目标</h3>
        <p class="c-card__body">
          先写清楚完成后的样子，<br />让大家朝同一个方向走。
        </p>
      </article>
      <article class="c-card">
        <span class="c-card__index">02 / DECIDE</span>
        <div class="workflow-glyph" aria-hidden="true">▤</div>
        <h3 class="c-card__title">保留决策</h3>
        <p class="c-card__body">
          把选择与理由放在任务旁，<br />减少反复解释的成本。
        </p>
      </article>
      <article class="c-card c-card--accent">
        <span class="c-card__index">03 / MOVE</span>
        <div class="workflow-glyph" aria-hidden="true">↗</div>
        <h3 class="c-card__title">推进下一步</h3>
        <p class="c-card__body">明确负责人和检查点，<br />让进度持续可见。</p>
      </article>
    </div>
    <div class="deck-footer">
      <span>ALIGN → DECIDE → MOVE</span><span>03</span>
    </div>
  </div>
</section>
