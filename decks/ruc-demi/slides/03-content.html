<section
  id="content"
  class="slide ruc-slide ruc-content"
  data-title="结构化输入"
  data-notes="内容页展示模板的核心工作区：左侧是可以自由修改的分组列表，右侧用三个小卡片承载证据、交互和交付信息。底部波纹装饰用 CSS 绘制，因此不依赖不可编辑的截图。"
  aria-label="内容页：结构化输入，包含内容层、展示层以及三个可复用模块"
>
  <header class="ruc-content-header">
    <img
      class="ruc-section-mark"
      src="decks/ruc-demi/assets/section-bars.png"
      alt="蓝色和青色柱状章节图标"
    />
    <h1 class="ruc-content-title">结构化输入</h1>
  </header>
  <div class="ruc-content-layout">
    <div class="ruc-content-column">
      <section class="ruc-content-block">
        <h2>内容层</h2>
        <ul>
          <li>一句话目标与听众</li>
          <li>清晰的章节顺序</li>
          <li>需要现场解释的证据</li>
        </ul>
      </section>
      <section class="ruc-content-block">
        <h2>展示层</h2>
        <ul>
          <li>每页只表达一个动作</li>
          <li>把长文本换成结构</li>
          <li>为交互留出真实空间</li>
        </ul>
      </section>
    </div>
    <div class="ruc-content-summary" aria-label="模板可复用模块">
      <article class="ruc-summary-card">
        <strong>可编辑</strong><span>标题、列表、卡片都是普通 HTML 元素。</span>
      </article>
      <article class="ruc-summary-card">
        <strong>可交互</strong><span>按钮、输入框和动画可以进入同一张幻灯片。</span>
      </article>
      <article class="ruc-summary-card">
        <strong>可发布</strong><span>构建后得到独立网页，直接通过网络演示。</span>
      </article>
    </div>
  </div>
  <div class="ruc-wave-footer" aria-hidden="true"></div>
</section>
